<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XD TECH - ACCESS GATE</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .access-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .access-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .access-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--purple-primary), transparent);
        }

        .access-icon {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .access-box h1 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .access-box h1 span {
            color: var(--purple-primary);
        }

        .access-subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .access-input-group {
            margin-bottom: 1.5rem;
        }

        .access-input-group label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--purple-primary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            text-align: left;
        }

        .access-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .access-input-wrapper:focus-within {
            border-color: var(--purple-primary);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        .access-input-prefix {
            padding: 1rem;
            font-family: var(--font-mono);
            color: var(--purple-primary);
            background: rgba(139, 92, 246, 0.1);
            border-right: 1px solid var(--border);
        }

        .access-input-wrapper input {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            text-align: center;
            letter-spacing: 0.2em;
        }

        .access-input-wrapper input::placeholder {
            color: var(--text-muted);
            letter-spacing: normal;
        }

        .access-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--purple-primary) 0%, var(--purple-secondary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .access-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        .access-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .access-error {
            color: var(--error);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            margin-top: 1rem;
            display: none;
        }

        .access-social {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .access-social a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .access-social a:hover {
            border-color: var(--purple-primary);
            color: var(--purple-primary);
        }

        .access-footer {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="access-container">
        <div class="access-box">
            <div class="access-icon">
                <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
                    <path d="M16 2L4 8v8c0 8 5.5 13.5 12 14 6.5-.5 12-6 12-14V8L16 2z" stroke="url(#grad)" stroke-width="2" fill="rgba(139, 92, 246, 0.1)"/>
                    <circle cx="16" cy="14" r="4" fill="url(#grad)"/>
                    <path d="M16 18v6" stroke="url(#grad)" stroke-width="2"/>
                    <defs>
                        <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32">
                            <stop offset="0%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#7c3aed"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h1>LONER<span>TECH</span></h1>
            <p class="access-subtitle">ACCESS GATE</p>

            <form id="accessForm">
                <div class="access-input-group">
                    <label>ACCESS_KEY</label>
                    <div class="access-input-wrapper">
                        <span class="access-input-prefix">#</span>
                        <input 
                            type="password" 
                            id="accessKey" 
                            placeholder="Enter access key"
                            autocomplete="off"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="access-btn" id="accessBtn">
                    <span id="btnText">ACCESS_SITE</span>
                    <span id="btnLoading" style="display: none;">VERIFYING...</span>
                </button>

                <div class="access-error" id="accessError"></div>
            </form>

            <div class="access-social">
                <a href="https://t.me/escanorsxdtech" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                    </svg>
                    TELEGRAM
                </a>
                <a href="https://whatsapp.com/channel/0029VbDR7Tt77qVQfH1LLu2R" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    WHATSAPP
                </a>
            </div>

            <div class="access-footer">
                XDTECH © 2026
            </div>
        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const accessKey = document.getElementById('accessKey').value;
            const btn = document.getElementById('accessBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const error = document.getElementById('accessError');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            error.style.display = 'none';
            
            try {
                const res = await fetch('/api/access/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessKey })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    localStorage.setItem('accessToken', data.token);
                    window.location.href = '/?token=' + data.token;
                } else {
                    throw new Error(data.error || 'Invalid access key');
                }
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
